name: Run Selenium Tests with Maven

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up Java 16
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 16
          cache: maven

      # 3️⃣ Install Chrome for Selenium
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      # 4️⃣ Run Maven tests and generate coverage
      - name: Install dependencies and run tests
        run: mvn -B clean verify
        working-directory: ./AutomatedTestingSQA

      # 5️⃣ Upload Selenium screenshots (if any)
      - name: Upload Selenium screenshots
        if: always()  # ensures it runs even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: selenium-screenshots
          path: ./AutomatedTestingSQA/screenshots/**/*.png

      # 6️⃣ Upload Surefire test reports
      - name: Upload Surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: ./AutomatedTestingSQA/target/surefire-reports/

      # 7️⃣ Upload JaCoCo coverage reports
      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: ./AutomatedTestingSQA/target/site/jacoco/

      # 8️⃣ SonarCloud Scan
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: ./AutomatedTestingSQA
          organization: YOUR_SONARCLOUD_ORG   # replace with your SonarCloud organization key
          token: ${{ secrets.SONAR_TOKEN }}
