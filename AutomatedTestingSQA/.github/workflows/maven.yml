name: Run Selenium Tests with Maven

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 16
          cache: maven

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run Maven tests and package jar
        run: mvn -B clean verify package
        working-directory: ./AutomatedTestingSQA

      - name: List generated files
        run: |
          echo "Screenshots:"
          ls -R ./AutomatedTestingSQA/screenshots || echo "No screenshots folder"
          echo "Surefire reports:"
          ls -R ./AutomatedTestingSQA/target/surefire-reports || echo "No surefire reports"
          echo "JaCoCo reports:"
          ls -R ./AutomatedTestingSQA/target/site/jacoco || echo "No jacoco reports"
          echo "Jar files:"
          ls -R ./AutomatedTestingSQA/target/*.jar || echo "No jar files"

      # 6️⃣ Upload Selenium screenshots (if any)
      - name: Upload Selenium screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-screenshots
          path: ./AutomatedTestingSQA/screenshots

    
      - name: Upload Surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            ./AutomatedTestingSQA/target/surefire-reports/*.xml
            ./AutomatedTestingSQA/target/surefire-reports/*.txt

      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: ./AutomatedTestingSQA/target/site/jacoco/**/*

      - name: Upload Maven build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: my-app-jar
          path: ./AutomatedTestingSQA/target/*.jar


      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: ./AutomatedTestingSQA
          organization: YOUR_SONARCLOUD_ORG
          token: ${{ secrets.SONAR_TOKEN }}
