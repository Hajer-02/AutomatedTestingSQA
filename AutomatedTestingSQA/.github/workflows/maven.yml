name: Run Selenium Tests with Maven

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up Java 16
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 16
          cache: maven

      # 3️⃣ Install Chrome for Selenium
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      # 4️⃣ Run Maven tests and package jar
      - name: Run Maven tests and package jar
        run: mvn -B clean verify package
        working-directory: ./AutomatedTestingSQA

      # 5️⃣ Debug: list generated folders (optional, helps verify)
      - name: List generated files
        run: |
          echo "Screenshots:"
          ls -R ./AutomatedTestingSQA/screenshots || echo "No screenshots folder"
          echo "Surefire reports:"
          ls -R ./AutomatedTestingSQA/target/surefire-reports || echo "No surefire reports"
          echo "JaCoCo reports:"
          ls -R ./AutomatedTestingSQA/target/site/jacoco || echo "No jacoco reports"
          echo "Jar files:"
          ls -R ./AutomatedTestingSQA/target/*.jar || echo "No jar files"

      # 6️⃣ Upload Selenium screenshots (if any)
      - name: Upload Selenium screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-screenshots
          path: ./AutomatedTestingSQA/screenshots

      # 7️⃣ Upload Surefire test reports (.xml + .txt)
      - name: Upload Surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            ./AutomatedTestingSQA/target/surefire-reports/*.xml
            ./AutomatedTestingSQA/target/surefire-reports/*.txt

      # 8️⃣ Upload JaCoCo coverage reports (all files)
      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: ./AutomatedTestingSQA/target/site/jacoco/**/*

      # 9️⃣ Upload built jar
      - name: Upload Maven build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: my-app-jar
          path: ./AutomatedTestingSQA/target/*.jar

      # 🔟 SonarCloud Scan (optional, keep if you use Sonar)
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: ./AutomatedTestingSQA
          organization: YOUR_SONARCLOUD_ORG
          token: ${{ secrets.SONAR_TOKEN }}
